name: Android build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v4
        with:
          node-version: "20"
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Generar sitio
        run: |
          python -m pip install PyYAML markdown
          python scripts/generate_site.py
          test -s site/classes/183.html
      - name: Preparar proyecto Capacitor
        working-directory: apps/android
        run: |
          mkdir -p www
          cp -r ../../site/* www/
          npm install
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android
      - name: Compilar APK
        working-directory: apps/android/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Verificar contenido del APK (anti-vacio)
        run: |
          APK=apps/android/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          COUNT=$(unzip -l "$APK" "assets/public/classes/*.html" | grep -c '\.html' || true)
          echo "Paginas HTML dentro del APK: $COUNT"
          if [ "$COUNT" -ne 198 ]; then
            echo "ERROR: el APK no contiene las 198 paginas de clases"
            exit 1
          fi
      - name: Renombrar el APK con su version y firmar checksum
        run: |
          VERSION=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          mkdir -p dist
          cp apps/android/android/app/build/outputs/apk/debug/app-debug.apk              "dist/AI-Evolution-Program-$VERSION-android.apk"
          cd dist && sha256sum *.apk > SHA256SUMS-android.txt && cat SHA256SUMS-android.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AI-Evolution-Program-android
          path: |
            dist/*.apk
            dist/SHA256SUMS-android.txt
          if-no-files-found: error
