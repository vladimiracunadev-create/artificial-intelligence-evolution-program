name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate_repository.py --strict
      - run: python scripts/generate_papers.py --check
      - run: python scripts/link_papers_to_classes.py --check
      - run: python scripts/build_sources.py --check
      - run: python scripts/annotate_class_sources.py --check
      - run: python scripts/link_sources_to_classes.py --check
      - run: python scripts/verify-sources
      - run: python scripts/check_frontier.py
      - run: python -m compileall -q src scripts classes apps
