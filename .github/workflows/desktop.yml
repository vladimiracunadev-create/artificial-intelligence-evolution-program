name: Desktop build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - run: pyinstaller --noconfirm --onefile --windowed --name AI-Evolution-Program --add-data "site;site" apps/desktop/main.py
      - name: Verify executable exists
        run: |
          if (-not (Test-Path "dist/AI-Evolution-Program.exe")) { exit 1 }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AI-Evolution-Program-windows
          path: dist/AI-Evolution-Program.exe
          if-no-files-found: error
