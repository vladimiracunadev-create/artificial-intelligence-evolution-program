# Investigacion posterior a la ruta ampliada del eje de papers.
# Entra aqui, y no en papers/foundational/, porque no cumple todavia el criterio
# de ascenso de prompts/VIGILANCIA_DE_FRONTERA.md (12 meses + replicacion +
# errores comunes documentables). Se relee con fecha, no se cita como firme.
- id: hybrid-attention-ssm
  name: Arquitecturas hibridas atencion + espacios de estados
  category: architecture
  maturity: emerging
  reviewed: '2026-08-16'
  source: https://arxiv.org/abs/2403.19887
  reason: >-
    Alternar bloques de atencion y de SSM busca la memoria constante de Mamba
    sin perder la recuperacion exacta de la atencion. Continua P20 y P21.
- id: test-time-compute
  name: Escalar computo en inferencia
  category: reasoning
  maturity: emerging
  reviewed: '2026-08-16'
  source: https://arxiv.org/abs/2408.03314
  reason: >-
    Asignar mas computo al responder puede rendir mas que agrandar el modelo.
    Es la variable que las leyes de escalado de P19 no modelan y que P22 explota.
- id: verifiable-rewards-beyond-code
  name: Recompensas verificables fuera de matematicas y codigo
  category: alignment
  maturity: emerging
  reviewed: '2026-08-16'
  source: https://doi.org/10.1038/s41586-025-09422-z
  reason: >-
    P22 funciona porque la respuesta se puede comprobar. Extenderlo a dominios
    sin verificador barato es la pregunta abierta que deja el paper.

# Revision 2026-09-22. Son resultados recientes del emisor o marcos aun sin
# consenso; enriquecen clases existentes, pero no ascienden al eje fundacional.
- id: automated-research-agents
  name: Agentes para investigacion automatizada supervisada
  category: agentic-science
  maturity: emerging
  reviewed: '2026-09-22'
  source: https://openai.com/index/research-acceleration-view-inside-openai/
  corroborating_source: https://www.anthropic.com/research/automated-researchers-mitigate-alignment-failures
  reason: >-
    Dos laboratorios reportan agentes que ejecutan ciclos largos de busqueda,
    experimentacion y evaluacion. Demuestra utilidad en tareas acotadas con
    verificadores; no demuestra investigacion autonoma general ni elimina la
    seleccion humana de problemas, metodos y conclusiones.
- id: formal-verification-ai-science
  name: Descubrimiento matematico asistido por agentes con verificacion formal
  category: ai-for-science
  maturity: emerging
  reviewed: '2026-09-22'
  source: https://openai.com/index/navier-stokes-solution/
  reason: >-
    Un sistema multiagente produjo una prueba analitica y un artefacto Lean para
    un problema abierto. La prueba formal hace verificable el objeto matematico,
    pero el resultado es reciente, de enorme costo y no establece capacidad
    cientifica general ni validacion independiente de todo el proceso.
- id: latent-workspace-interpretability
  name: Espacios latentes de trabajo para interpretar razonamiento interno
  category: interpretability
  maturity: emerging
  reviewed: '2026-09-22'
  source: https://www.anthropic.com/research/global-workspace
  reason: >-
    Intervenciones causales sobre un subespacio interno relacionan conceptos
    latentes con razonamiento de varios pasos y permiten observar señales que no
    aparecen en la salida. Es evidencia en una familia de modelos, no una lectura
    completa del pensamiento ni evidencia de consciencia.
- id: misalignment-incident-reporting
  name: Divulgacion estructurada de incidentes de desalineacion
  category: governance
  maturity: emerging
  reviewed: '2026-09-22'
  source: https://openai.com/index/model-misalignment-reporting-framework/
  reason: >-
    Propone campos, criterios y plazos para investigar y publicar conductas no
    autorizadas durante entrenamiento, evaluacion y despliegue. Aporta casos
    operativos utiles para auditoria, pero sigue siendo un marco unilateral y no
    un estandar sectorial.

# Revision 2026-10-05. Cambios posteriores al corte anterior que alteran una
# decision de arquitectura, seguridad, interoperabilidad o cumplimiento.
- id: confidential-private-inference
  name: Inferencia privada y computacion confidencial verificable
  category: privacy-and-systems
  maturity: emerging
  reviewed: '2026-10-05'
  source: https://deepmind.google/blog/advancing-private-ai-compute-with-secure-server-side-memory/
  corroborating_source: https://openai.com/index/devday-2026-recap/
  reason: >-
    Dos proveedores describen computo remoto aislado, controles verificables y
    memoria cifrada para reducir acceso del operador a datos en uso. La direccion
    justifica una clase sobre TEE y attestation; las implementaciones concretas
    siguen siendo anuncios del emisor y requieren evidencia independiente.
- id: adversarial-model-distillation
  name: Destilacion adversarial y extraccion coordinada de razonamiento
  category: security
  maturity: emerging
  reviewed: '2026-10-05'
  source: https://openai.com/index/disrupting-a-coordinated-model-distillation-campaign/
  reason: >-
    Un proveedor reporta una campana distribuida para extraer razonamiento y
    transferir capacidades mediante salidas autorizadas. Amplia el threat model
    desde robo de datos a robo de capacidad; las cifras describen intentos y no
    equivalen a extracciones exitosas ni a prevalencia sectorial.
- id: agent-identity-and-delegated-authorization
  name: Identidad de agentes y autorizacion delegada
  category: agent-security
  maturity: emerging
  reviewed: '2026-10-05'
  source: https://www.nist.gov/artificial-intelligence/ai-agent-standards-initiative
  reason: >-
    NIST impulsa identidad, autenticacion y autorizacion para interacciones
    humano-agente y multiagente. La necesidad operativa es actual; los perfiles
    y estandares concretos todavia estan en desarrollo.
- id: a2a-1-1-roadmap
  name: A2A 1.1, streaming bidireccional y elicitation estructurada
  category: agent-interoperability
  maturity: emerging
  reviewed: '2026-10-05'
  source: https://a2a-protocol.org/latest/roadmap/
  reason: >-
    La hoja de ruta propone timelines, filtrado, BiDi, negociacion multironda,
    HITL estructurado, Inspector y TCK. No se marca como estandar hasta existir
    especificacion estable y pruebas de conformidad versionadas.
- id: eu-ai-content-labeling
  name: Marcado y etiquetado europeo de contenido generado por IA
  category: governance
  maturity: current
  reviewed: '2026-10-05'
  source: https://digital-strategy.ec.europa.eu/en/news/commission-publishes-code-practice-marking-and-labelling-ai-generated-content
  reason: >-
    El codigo final ofrece pasos para obligaciones de transparencia aplicables
    desde agosto de 2026: avisos de chatbot, etiquetas de deepfakes y texto de
    interes publico, marcas legibles por maquina e iconos europeos.
- id: preference-fidelity-economic-agents
  name: Fidelidad de preferencias en agentes economicos
  category: human-agent-interaction
  maturity: emerging
  reviewed: '2026-10-05'
  source: https://www.anthropic.com/research/project-swap
  reason: >-
    Un experimento empresarial de negociacion muestra que representar mal las
    preferencias humanas puede explicar mas perdida que el protocolo de mercado.
    Es un resultado del emisor en un dominio acotado, util para disenar gates,
    cancelacion y evaluacion principal-agente, no una ley general.
